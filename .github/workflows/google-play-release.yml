name: Google Play release (manual approval)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Full 40-character commit SHA from main
        required: true
        type: string
      version_name:
        description: Numeric version name, for example 1.1.0
        required: true
        type: string
      version_code:
        description: New integer versionCode (must exceed every prior Play upload)
        required: true
        type: string
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: Draft stores the edit; completed distributes according to the selected track
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
      confirmation:
        description: Type RELEASE com.fleetmanager.fleet_manager_mobile
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: fleet-google-play
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload approved production AAB
    runs-on: ubuntu-latest
    environment: google-play-production
    env:
      APPROVED_REF: ${{ inputs.git_ref }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      PLAY_TRACK: ${{ inputs.track }}
      PLAY_STATUS: ${{ inputs.release_status }}
      GH_TOKEN: ${{ github.token }}
      FLEET_API_BASE_URL: https://api.fleetaisystems.com
      PLAY_UPLOAD_CERT_SHA256: ${{ secrets.PLAY_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Verify explicit approval, version, and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$RELEASE_CONFIRMATION" == "RELEASE com.fleetmanager.fleet_manager_mobile" ]]
          [[ "$APPROVED_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$checked_out_sha" == "$APPROVED_REF" ]]
          [[ "$RELEASE_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$checked_out_sha" origin/main
          printf 'RELEASE_SHA=%s\n' "$checked_out_sha" >>"$GITHUB_ENV"

      - name: Require successful CI for this commit
        shell: bash
        run: |
          set -euo pipefail
          conclusion="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&status=completed&per_page=20" \
            --jq '.workflow_runs | map(select(.event == "push" and .head_branch == "main")) | first | .conclusion // "missing"')"
          [[ "$conclusion" == "success" ]] || {
            echo "CI for $RELEASE_SHA is not successful: $conclusion" >&2
            exit 1
          }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install the separate Google Play upload identity
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/fleet-signing" "$RUNNER_TEMP/gradle"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/fleet-signing/play-upload.jks"
          chmod 0600 "$RUNNER_TEMP/fleet-signing/play-upload.jks"
          {
            printf 'fleetPlayStoreFile=%s\n' "$RUNNER_TEMP/fleet-signing/play-upload.jks"
            printf 'fleetPlayStorePassword=%s\n' "$PLAY_UPLOAD_STORE_PASSWORD"
            printf 'fleetPlayKeyAlias=%s\n' "$PLAY_UPLOAD_KEY_ALIAS"
            printf 'fleetPlayKeyPassword=%s\n' "$PLAY_UPLOAD_KEY_PASSWORD"
          } >"$RUNNER_TEMP/gradle/gradle.properties"
          chmod 0600 "$RUNNER_TEMP/gradle/gradle.properties"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle" >>"$GITHUB_ENV"

      - name: Test mobile release candidate
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed production AAB for the cloud API
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --flavor production --release \
            --build-name "$RELEASE_VERSION_NAME" \
            --build-number "$RELEASE_VERSION_CODE" \
            --dart-define=FLEET_AUTH_MODE=company_pin \
            --dart-define=FLEET_API_BASE_URL="$FLEET_API_BASE_URL"

      - name: Verify package, version, signature, and absence of sideload permission
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_play_aab.py \
            apps/mobile/build/app/outputs/bundle/productionRelease/app-production-release.aab \
            --version-name "$RELEASE_VERSION_NAME" \
            --version-code "$RELEASE_VERSION_CODE" \
            --signer-sha256 "$PLAY_UPLOAD_CERT_SHA256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-ai-google-play-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: apps/mobile/build/app/outputs/bundle/productionRelease/app-production-release.aab
          if-no-files-found: error
          retention-days: 30

      - id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 3600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Commit the approved Google Play edit
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          bash scripts/production/upload-play-aab.sh \
            apps/mobile/build/app/outputs/bundle/productionRelease/app-production-release.aab \
            com.fleetmanager.fleet_manager_mobile \
            "$RELEASE_VERSION_NAME" \
            "$RELEASE_VERSION_CODE" \
            "$PLAY_TRACK:$PLAY_STATUS"

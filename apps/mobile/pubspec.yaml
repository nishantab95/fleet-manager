name: fleet_manager_mobile
description: Android-first offline-capable driver client shell for Fleet Manager.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  cupertino_icons: 1.0.8
  drift: 2.35.0
  flutter:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  http: 1.5.0
  image_picker: 1.2.0
  path: 1.9.1
  path_provider: 2.1.5
  share_plus: 10.1.4
  sqlite3_flutter_libs: 0.5.29
  uuid: 4.5.1
  url_launcher: 6.3.2

dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.0
  flutter_lints: 5.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
